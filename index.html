    // ==========================================
    // 4. SAHIRANK ALGORITHM & CREATOR LEVEL ENGINE
    // ==========================================
    function calculateSahiRank(biz) {
      const revs = biz.reviews || [];
      if (revs.length === 0) return { avgRating: 4.5, trustScore: 78, posCount: 0, negCount: 0, rankScore: 50 };
      const totalStars = revs.reduce((acc, r) => acc + r.stars, 0);
      const avgRating = Number((totalStars / revs.length).toFixed(1));
      const posCount = revs.filter(r => r.stars >= 4).length;
      const negCount = revs.filter(r => r.stars <= 3).length;
      const verifiedCount = revs.filter(r => r.verifiedBill).length;

      const posRatio = (posCount / revs.length) * 60;
      const verBonus = (verifiedCount / revs.length) * 25;
      const claimBonus = biz.claimed ? 15 : 5;
      const trustScore = Math.min(99, Math.round(posRatio + verBonus + claimBonus));

      const sponsorBoost = biz.isSponsored ? 1000 : 0;
      const rankScore = sponsorBoost + trustScore * 5 + (biz.searchAppearances || 0) * 0.05;

      return { avgRating, trustScore, posCount, negCount, rankScore };
    }

    function getCreatorLevelInfo(points) {
      const levels = [
        { level: 1, title: "Level 1: Newbie Reviewer", minPoints: 0 },
        { level: 2, title: "Level 2: Rising Voice", minPoints: 100 },
        { level: 3, title: "Level 3: Verified Critic", minPoints: 250 },
        { level: 4, title: "Level 4: City Influencer", minPoints: 400 },
        { level: 5, title: "Level 5: SahiRank Partner (20% Revenue Share Eligible)", minPoints: 500 }
      ];
      let current = levels[0];
      for (const l of levels) {
        if (points >= l.minPoints) current = l;
      }
      const isMonetized = points >= 500;
      const progressPct = Math.min(100, Math.round((points / 500) * 100));
      return { ...current, isMonetized, progressPct };
    }

                  />
                  <button type="submit" className="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-xs shadow">
                    ✅ Verify & Claim Business
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* SUGGEST MODAL */}
          {suggestModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl w-full max-w-md p-6 relative">
                <button onClick={() => setSuggestModal(false)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 grid place-items-center">✕</button>
                <h3 className="font-display font-bold text-lg text-slate-900">Add / Suggest Listing in {selectedCity.name}</h3>
                <form onSubmit={handleSuggestSubmit} className="mt-4 space-y-3">
                  <input
                    type="text"
                    required
                    value={suggestForm.name}
                    onChange={(e) => setSuggestForm({ ...suggestForm, name: e.target.value })}
                    placeholder="Business / Hospital / Showroom Name *"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs"
                  />
                  <select
                    value={suggestForm.category}
                    onChange={(e) => setSuggestForm({ ...suggestForm, category: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                  >
                    {CATEGORIES.filter(c => c.id !== "All").map(c => (
                      <option key={c.id} value={c.id}>{c.label}</option>
                    ))}
                  </select>
                  <input
                    type="text"
                    value={suggestForm.address}
                    onChange={(e) => setSuggestForm({ ...suggestForm, address: e.target.value })}
                    placeholder="Address / Area"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs"
                  />
                  <button type="submit" className="w-full py-3 rounded-xl bg-orange-600 text-white font-bold text-xs shadow">
                    ✅ Add Listing
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* PAYMENT MODAL (CLEAN FOR CUSTOMERS — NO REVENUE SPLIT SHOWN TO PUBLIC!) */}
          {paymentModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl w-full max-w-md p-6 relative text-center">
                <button onClick={() => setPaymentModal(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 grid place-items-center">✕</button>
                <div className="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 grid place-items-center mx-auto text-2xl font-bold">
                  🔒
                </div>
                <h3 className="font-display font-bold text-lg text-slate-900 mt-3">{paymentModal.title}</h3>
                <p className="text-xs text-slate-500 mt-1">{paymentModal.desc}</p>

                <div className="my-4 p-4 rounded-2xl bg-slate-50 border border-slate-200">
                  <div className="text-xs text-slate-500 font-bold">Payable Amount (Incl. GST)</div>
                  <div className="text-3xl font-extrabold text-slate-900 mt-0.5">₹{paymentModal.amount}</div>
                  <div className="text-[11px] text-emerald-700 font-semibold mt-1">
                    ✅ 100% Secure UPI / Card / NetBanking Instant Unlock
                  </div>
                </div>

                <button
                  onClick={() => {
                    paymentModal.onSuccess();
                    setPaymentModal(null);
                  }}
                  className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow-lg"
                >
                  ⚡ Pay ₹{paymentModal.amount} & Unlock Instantly
                </button>
              </div>
            </div>
          )}

          {/* TOAST */}
          {toast && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl bg-slate-900 text-white text-xs sm:text-sm font-bold shadow-2xl border border-orange-500 max-w-lg text-center">
              {toast}
            </div>
          )}

          {/* ==========================================
              FOOTER (WITH HIDDEN 5-CLICK ADMIN TRIGGER ON 'S' BADGE)
          ========================================== */}
          <footer className="max-w-[1400px] w-full mx-auto px-3 sm:px-6 py-6 text-xs text-slate-500 border-t border-slate-200 mt-8 flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <span
                onClick={handleSecretLogoClick}
                className="w-5 h-5 rounded bg-slate-200 text-slate-600 inline-grid place-items-center font-bold text-[10px] select-none cursor-default"
              >
                S
              </span>
              <span>© 2026 SahiRank India — Verified Consumer Trust & Business Intelligence Platform.</span>
            </div>
            <div>All 28 States & 8 UTs Active • Genuine Review Protection Enabled</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
