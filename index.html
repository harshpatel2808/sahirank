    // 6. LOCATION AUTOCOMPLETE PICKER
    // ==========================================
    function LocationPicker({ value, onSelect, placeholder, allowCustom = false }) {
      const [query, setQuery] = useState(value);
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      useEffect(() => { setQuery(value); }, [value]);

      useEffect(() => {
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
      }, []);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q || q.includes("all india")) return ALL_LOCATIONS.slice(0, 20);
        return ALL_LOCATIONS.filter(loc =>
          loc.display.toLowerCase().includes(q) ||
          loc.name.toLowerCase().includes(q) ||
          loc.district.toLowerCase().includes(q) ||
          loc.state.toLowerCase().includes(q)
        ).sort((a, b) => {
          if (a.name === "All India") return -1;
          if (b.name === "All India") return 1;
          const aStarts = a.name.toLowerCase().startsWith(q) ? -1 : 0;
          const bStarts = b.name.toLowerCase().startsWith(q) ? -1 : 0;
          return aStarts - bStarts;
        }).slice(0, 22);
      }, [query]);

      const canAddCustom = allowCustom && query.trim().length > 2 && !ALL_LOCATIONS.some(l => l.name.toLowerCase() === query.trim().toLowerCase());

      return (
        <div ref={ref} className="relative w-full">
          <div className={`flex items-center gap-2 px-3.5 py-2.5 rounded-xl border-2 bg-white transition-all ${open ? "border-orange-500 ring-4 ring-orange-500/15" : "border-orange-200"}`}>
            <span className="text-orange-500 text-base">📍</span>
            <input
              value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => {
                if (query.includes("All India")) setQuery("");
                setOpen(true);
              }}
              placeholder={placeholder}
              className="flex-1 bg-transparent outline-none text-sm font-medium text-stone-900 placeholder:text-stone-400"
            />
            {query && (
              <button
                type="button"
                onClick={() => { setQuery(""); setOpen(true); }}
                className="text-xs px-1.5 py-0.5 rounded bg-stone-100 hover:bg-stone-200 text-stone-600"
              >
                ✕
              </button>
            )}
          </div>

          {open && (
            <div className="absolute z-50 mt-2 w-full bg-white border border-orange-200 rounded-2xl shadow-2xl max-h-72 overflow-auto p-2">
              {filtered.map((loc, idx) => (
                <button
                  type="button"
                  key={idx + loc.display}
                  onClick={() => { onSelect(loc); setQuery(loc.display); setOpen(false); }}
                  className="w-full text-left px-3 py-2.5 rounded-xl hover:bg-orange-50 flex items-start gap-2.5 transition"
                >
                  <span className="text-base">{loc.name === "All India" ? "🌍" : "📍"}</span>
                  <div className="flex-1">
                    <div className="text-sm font-semibold text-stone-900">{loc.display}</div>
                    <div className="text-[11px] text-stone-500">
                      {loc.state} • Famous Places, Hospitals, Hotels & Coaching Available
                    </div>
                  </div>
                </button>
              ))}
              {canAddCustom && (
                <button
                  type="button"
                  onClick={() => {
                    const customLoc = { name: query.trim(), district: query.trim(), state: "India", display: `${query.trim()} - India` };
                    onSelect(customLoc);
                    setOpen(false);
                  }}
                  className="w-full text-left px-3 py-2.5 rounded-xl bg-orange-50 border border-dashed border-orange-400 mt-1 flex items-center gap-2 text-xs font-semibold text-orange-800"
                >
                  <span>➕</span>
                  <span>'{query.trim()}' ko naye shehar/gaon ke roop me kholo</span>
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

          ? `${cloudConfig.url.replace(/\/$/, "")}/sahirank_places.json`
          : `${cloudConfig.url.replace(/\/$/, "")}/rest/v1/sahirank_places?select=*`;

        const headers = cloudConfig.provider === "supabase" && cloudConfig.apiKey
          ? { "apikey": cloudConfig.apiKey, "Authorization": `Bearer ${cloudConfig.apiKey}` }
          : {};

        fetch(endpoint, { headers })
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (!data) return;

      }, [cloudConfig.enabled, cloudConfig.url]);

      // Fetch Wikipedia & Live Coordinates when City changes
      useEffect(() => {
        const cleanName = selectedLoc.name.replace(/\(.*\)/, "").trim().toLowerCase();

        const fallback = COORDS_DB[selectedLoc.name.toLowerCase()] || COORDS_DB[cleanName] || COORDS_DB[stateName] || { lat: 25.3176, lng: 82.9739 };
        setDynamicCoords(fallback);

          setCityWiki(null);
          return;
        }

        let active = true;
        setLoadingWiki(true);
        const queryCity = selectedLoc.name.replace(/\(.*\)/, "").trim();

        fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(queryCity)}`)
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (!active) return;
            if (data && data.extract) {

                title: data.title,

                thumbnail: data.thumbnail?.source || null,
                url: data.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${queryCity}`
              });

                setDynamicCoords({ lat: data.coordinates.lat, lng: data.coordinates.lon });

              setCityWiki(null);
            }
          })
          .catch(() => { if (active) setCityWiki(null); })
          .finally(() => { if (active) setLoadingWiki(false); });

        return () => { active = false; };

          );

          const generated = generateCompleteCityData(selectedLoc, dynamicCoords);
          // Merge so every city has Landmarks, Hospitals, Hotels, Coaching, Food & Markets!
          const existingCats = new Set(matched.map(m => m.category));
          const missingGenerated = generated.filter(g => !existingCats.has(g.category));
          result = [...matched, ...missingGenerated];
        }

        if (category !== "All") {
          result = result.filter(p => p.category === category);
        }

        if (searchText.trim()) {
          const q = searchText.trim().toLowerCase();
          result = result.filter(p =>
            `${p.name} ${p.category} ${p.city} ${p.state} ${p.famousTag || ""} ${p.desc || ""}`.toLowerCase().includes(q)
          );
        }

        return result;
      }, [customPlaces, selectedLoc, category, searchText, dynamicCoords]);

      // Sync Leaflet Map
      useEffect(() => {
        if (!window.L) return;
        const el = document.getElementById("mainMap");
        if (!el) return;

        if (!mapRef.current) {
          mapRef.current = window.L.map("mainMap").setView([dynamicCoords.lat, dynamicCoords.lng], selectedLoc.name === "All India" ? 5 : 13);
          window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap contributors",
            maxZoom: 19
          }).addTo(mapRef.current);
        } else {
          mapRef.current.setView([dynamicCoords.lat, dynamicCoords.lng], selectedLoc.name === "All India" ? 5 : 13);
        }

        markersRef.current.forEach(m => { try { m.remove(); } catch {} });
        markersRef.current = [];

        displayedPlaces.forEach(p => {
          const m = window.L.marker([p.lat, p.lng])
            .addTo(mapRef.current)
            .bindPopup(`
              <div style="min-width:190px">
                <b style="color:#ff6b02;font-size:13px">${p.name}</b><br/>
                <span style="font-size:11px;font-weight:600;color:#333">${p.category}</span><br/>
                <span style="font-size:11px;color:#666">${p.famousTag || ""}</span><br/>
                <span style="font-size:11px">📍 ${p.city} • ⭐ ${p.rating}</span>
              </div>
            `);
          markersRef.current.push(m);
        });
      }, [dynamicCoords, displayedPlaces, selectedLoc]);

      // Auth Submit
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const { name, phoneOrEmail, password, city } = authForm;
        if (!phoneOrEmail.trim() || !password.trim()) {
          showToast("⚠️ Email/Phone aur Password zaroor bharein!");
          return;
        }
        if (authMode === "signup") {
          if (!name.trim()) { showToast("⚠️ Apna Naam bharein!"); return; }
          if (users.some(u => u.phoneOrEmail.toLowerCase() === phoneOrEmail.trim().toLowerCase())) {
            showToast("⚠️ Yeh Email/Phone pehle se registered hai. Kripya Login karein.");
            setAuthMode("login");
            return;
          }
          const newUser = { id: Date.now(), name: name.trim(), phoneOrEmail: phoneOrEmail.trim(), password, city };
          const nextUsers = [...users, newUser];
          setUsers(nextUsers);
          setCurrentUser(newUser);
          localStorage.setItem("sahirank_v18_users", JSON.stringify(nextUsers));
          localStorage.setItem("sahirank_v18_current_user", JSON.stringify(newUser));
          setAuthModal(false);
          showToast(`🎉 Welcome ${newUser.name}! Account ban gaya.`);
        } else {
          const found = users.find(u => u.phoneOrEmail.toLowerCase() === phoneOrEmail.trim().toLowerCase() && u.password === password);
          if (!found) {
            showToast("❌ Galat Email/Phone ya Password! Naya account banane ke liye Sign Up chunein.");
            return;
          }
          setCurrentUser(found);
          localStorage.setItem("sahirank_v18_current_user", JSON.stringify(found));
          setAuthModal(false);
          showToast(`✅ Welcome back, ${found.name}!`);
        }
      };

      // Push to Cloud Helper
      const pushPlaceToCloud = async (entry) => {
        if (!cloudConfig.enabled || !cloudConfig.url) return;
        try {
          if (cloudConfig.provider === "firebase") {
            const url = `${cloudConfig.url.replace(/\/$/, "")}/sahirank_places.json`;
            await fetch(url, { method: "POST", body: JSON.stringify(entry) });
          } else if (cloudConfig.provider === "supabase") {
            const url = `${cloudConfig.url.replace(/\/$/, "")}/rest/v1/sahirank_places`;
            await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": cloudConfig.apiKey,
                "Authorization": `Bearer ${cloudConfig.apiKey}`
              },
              body: JSON.stringify(entry)
            });
          }
        } catch (err) {
          console.warn("Cloud push failed, saved locally", err);
        }
      };

      // Add Place / Business Submit
      const handleAddBusiness = async (e) => {
        e.preventDefault();
        if (!bizForm.name.trim() || !bizForm.cityLoc) {
          showToast("⚠️ Naam aur City select karna zaroori hai!");
          return;
        }
        const loc = bizForm.cityLoc;
        const cleanName = loc.name.replace(/\(.*\)/, "").trim().toLowerCase();
        const baseCoord = COORDS_DB[cleanName] || COORDS_DB[loc.state.toLowerCase()] || dynamicCoords;

        const newEntry = {
          id: Date.now(),
          name: bizForm.name.trim(),
          category: bizForm.category,
          city: loc.name,
          district: loc.district,
          state: loc.state,
          lat: baseCoord.lat + (Math.random() - 0.5) * 0.015,
          lng: baseCoord.lng + (Math.random() - 0.5) * 0.015,
          rating: 4.9,
          reviews: 1,
          phone: bizForm.phone || "+91 98765 XXXXX",
          open: true,
          isFamous: true,
          famousTag: bizForm.famousTag || `Verified ${bizForm.category} in ${loc.name}`,
          desc: bizForm.desc || `${loc.name} me sthit pramukh ${bizForm.category} kendra.`,
          address: bizForm.address || `Main Market Road, ${loc.name}, ${loc.state}`,
          addedBy: currentUser ? currentUser.name : "Community Member",
          reviewList: []
        };

        const updated = [newEntry, ...customPlaces];
        setCustomPlaces(updated);
        localStorage.setItem("sahirank_v18_places", JSON.stringify(updated));
        await pushPlaceToCloud(newEntry);

        setSelectedLoc(loc);
        setAddModal(false);
        setBizForm({ name: "", category: "Hospital & Clinic", cityLoc: loc, phone: "", famousTag: "", desc: "", address: "" });
        showToast(`✅ '${newEntry.name}' ab ${loc.name} me live ho gaya!`);
      };

      // Submit Review
      const handleReviewSubmit = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setReviewTarget(null);
          setAuthMode("login");
          setAuthModal(true);
          showToast("🔐 Review dene ke liye pehle Login ya Sign Up karein!");
          return;
        }
        if (!newReview.text.trim()) {
          showToast("⚠️ Kripya apna review likhein!");
          return;
        }
        const pid = reviewTarget.id;
        const existing = reviewsMap[pid] || reviewTarget.reviewList || [];
        const entry = {
          user: currentUser.name,
          stars: Number(newReview.stars),
          text: newReview.text.trim(),
          date: new Date().toLocaleDateString("en-IN")
        };
        const updatedList = [entry, ...existing];
        const nextMap = { ...reviewsMap, [pid]: updatedList };
        setReviewsMap(nextMap);
        localStorage.setItem("sahirank_v18_reviews", JSON.stringify(nextMap));
        setNewReview({ stars: 5, text: "" });
        showToast(`⭐ Dhanyawad ${currentUser.name}! Aapka review post ho gaya.`);
      };

      const getCategoryBadgeStyle = (cat) => {
        if (cat === "Hospital & Clinic") return "bg-red-50 text-red-700 border-red-200";
        if (cat === "Hotel & Stay") return "bg-blue-50 text-blue-700 border-blue-200";
        if (cat === "Coaching & Institute") return "bg-purple-50 text-purple-700 border-purple-200";
        if (cat === "Famous Landmark") return "bg-amber-100 text-amber-900 border-amber-300";
        return "bg-orange-50 text-orange-800 border-orange-200";
      };

      const getCategoryIcon = (cat) => {
        if (cat === "Hospital & Clinic") return "🏥";
        if (cat === "Hotel & Stay") return "🏨";
        if (cat === "Coaching & Institute") return "🎓";
        if (cat === "Famous Landmark") return "🏛️";
        if (cat === "Famous Food") return "🍲";
        if (cat === "Famous Market") return "🛍️";
        if (cat === "Medical Store") return "💊";
        return "📱";

        <div className="min-h-screen flex flex-col">
          {/* NAVBAR */}

            <div className="max-w-[1380px] mx-auto px-3 sm:px-6 py-3 flex flex-col lg:flex-row gap-3 items-stretch lg:items-center">
              {/* Brand */}
              <div className="flex items-center justify-between gap-3 shrink-0">
                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setSelectedLoc(ALL_LOCATIONS[0])}>
                  <div className="w-10 h-10 rounded-xl bg-orange-500 grid place-items-center text-white font-bold text-lg shadow">
                    S
                  </div>
                  <div>
                    <div className="font-display font-bold text-lg leading-none">
                      SahiRank <span className="text-orange-500">V18 Ultimate</span>
                    </div>
                    <div className="text-[10px] text-stone-500 tracking-wider uppercase font-semibold mt-0.5">
                      Hospitals • Hotels • Coaching • Landmarks • Cloud DB
                    </div>
                  </div>
                </div>

                {/* Mobile Auth & Cloud */}
                <div className="flex lg:hidden items-center gap-1.5">

                  >
                    ☁️ {cloudConfig.enabled ? "Synced" : "Cloud DB"}
                  </button>
                  {currentUser ? (
                    <button onClick={() => { setCurrentUser(null); localStorage.removeItem("sahirank_v18_current_user"); }} className="text-xs px-2.5 py-1.5 rounded-xl bg-orange-100 text-orange-800 font-semibold">
                      👤 {currentUser.name.split(" ")[0]}

                    <button onClick={() => { setAuthMode("login"); setAuthModal(true); }} className="text-xs px-3 py-1.5 rounded-xl bg-stone-900 text-white font-semibold">
                      🔐 Login

              {/* Search & Location Picker */}
              <div className="flex-1 flex flex-col sm:flex-row gap-2">

                  <span>🔍</span>
                  <input
                    value={searchText}
                    onChange={(e) => setSearchText(e.target.value)}
                    placeholder="Search Hospital, Coaching, Hotel, Mandir ya Food..."
                    className="flex-1 bg-transparent outline-none text-sm text-stone-900 placeholder:text-stone-400"
                  />
                  {searchText && (
                    <button onClick={() => setSearchText("")} className="text-xs text-stone-500">✕</button>

              </div>

              {/* Desktop Action Buttons */}
              <div className="flex items-center gap-2 shrink-0">

                  onClick={() => {
                    setBizForm(prev => ({ ...prev, cityLoc: selectedLoc.name === "All India" ? ALL_LOCATIONS[1] : selectedLoc }));
                    setAddModal(true);
                  }}
                  className="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-semibold text-xs sm:text-sm shadow transition"
                >
                  <span>➕</span> Add Listing
                </button>

                <button
                  onClick={() => setCloudModal(true)}
                  className={`hidden lg:inline-flex items-center gap-1.5 px-3 py-2.5 rounded-xl border text-xs font-bold transition ${
                    cloudConfig.enabled
                      ? "bg-green-50 text-green-700 border-green-300"
                      : "bg-white hover:bg-orange-50 text-stone-700 border-orange-200"
                  }`}
                >
                  <span>☁️</span> {cloudConfig.enabled ? "Cloud Connected" : "Cloud DB"}
                </button>

                <div className="hidden lg:flex items-center">
                  {currentUser ? (
                    <div className="flex items-center gap-2 bg-orange-50 border border-orange-200 px-3 py-1.5 rounded-xl">
                      <div className="w-7 h-7 rounded-full bg-orange-500 text-white grid place-items-center text-xs font-bold">
                        {currentUser.name[0].toUpperCase()}
                      </div>
                      <div className="text-xs">
                        <div className="font-bold text-stone-900 leading-tight">{currentUser.name}</div>
                        <button
                          onClick={() => {
                            setCurrentUser(null);
                            localStorage.removeItem("sahirank_v18_current_user");
                            showToast("👋 Logged out!");
                          }}
                          className="text-[10px] text-red-600 font-semibold hover:underline"
                        >
                          Logout
                        </button>
                      </div>
                    </div>
                  ) : (
                    <button
                      onClick={() => { setAuthMode("login"); setAuthModal(true); }}
                      className="px-4 py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-semibold text-sm transition"
                    >
                      🔐 Login / Sign Up
                    </button>
                  )}
                </div>
              </div>
            </div>

            {/* CATEGORY PILLS */}
            <div className="border-t border-orange-100 bg-orange-50/60">
              <div className="max-w-[1380px] mx-auto px-3 sm:px-6 py-2 flex items-center gap-2 overflow-x-auto">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => setCategory(cat.id)}
                    className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold border transition ${
                      category === cat.id
                        ? "bg-orange-500 text-white border-orange-500 shadow-sm"
                        : "bg-white text-stone-700 border-orange-200 hover:border-orange-400"
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* QUICK CITY CHIPS */}
          <div className="max-w-[1380px] w-full mx-auto px-3 sm:px-6 pt-3 flex items-center gap-1.5 flex-wrap text-xs">
            <span className="font-bold text-stone-600 mr-1">⚡ Quick Jump:</span>
            {["All India", "Varanasi", "Kota", "Delhi", "Patna", "Prayagraj", "Lucknow", "Gyanpur", "Bhadohi", "Mumbai", "Jaipur", "Agra", "Ayodhya", "Indore", "Bengaluru"].map(city => {
              const locObj = ALL_LOCATIONS.find(l => l.name.toLowerCase() === city.toLowerCase()) || ALL_LOCATIONS[0];
              const active = selectedLoc.name.toLowerCase() === city.toLowerCase();
              return (
                <button
                  key={city}
                  onClick={() => setSelectedLoc(locObj)}
                  className={`px-2.5 py-1 rounded-full border font-semibold transition ${
                    active ? "bg-stone-900 text-white border-stone-900" : "bg-white border-orange-200 hover:border-orange-500 text-stone-700"
                  }`}
                >
                  {city}
                </button>
              );
            })}
          </div>

          {/* CITY LIVE WIKIPEDIA & OVERVIEW BANNER */}
          {selectedLoc.name !== "All India" && (
            <div className="max-w-[1380px] w-full mx-auto px-3 sm:px-6 mt-3">
              <div className="bg-gradient-to-r from-stone-900 via-stone-800 to-orange-950 text-white rounded-2xl p-4 sm:p-5 shadow-lg flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                <div className="flex items-start gap-4 flex-1">
                  {cityWiki?.thumbnail && (
                    <img
                      src={cityWiki.thumbnail}
                      alt={selectedLoc.name}
                      className="w-20 h-20 sm:w-24 sm:h-24 rounded-xl object-cover border-2 border-orange-400 shrink-0 bg-white"
                    />
                  )}
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-orange-500/30 border border-orange-400/40 text-orange-200 text-[11px] font-semibold mb-1">
                      <span>🌍 {selectedLoc.state}</span> • <span>Verified City Portal</span>
                    </div>
                    <h1 className="font-display font-bold text-xl sm:text-2xl text-white">
                      {selectedLoc.name} — Famous Places, Hospitals, Hotels & Coaching Guide
                    </h1>
                    <p className="text-xs sm:text-sm text-stone-300 mt-1 line-clamp-2 max-w-3xl">
                      {loadingWiki
                        ? `Internet se ${selectedLoc.name} ka live data aur coordinates load ho rahe hain...`
                        : cityWiki?.extract || `${selectedLoc.name} (${selectedLoc.state}) ke top Hospitals, Hotels, Coaching Institutes, Famous Landmarks aur Markets ki puri list niche uplabdh hai.`}
                    </p>
                  </div>
                </div>
                <div className="flex flex-wrap gap-2 shrink-0">
                  <button
                    onClick={() => setCategory("Hospital & Clinic")}
                    className="px-3 py-1.5 rounded-xl bg-red-500/20 border border-red-400/40 text-red-200 hover:bg-red-500/30 text-xs font-semibold"
                  >
                    🏥 Hospitals
                  </button>
                  <button
                    onClick={() => setCategory("Hotel & Stay")}
                    className="px-3 py-1.5 rounded-xl bg-blue-500/20 border border-blue-400/40 text-blue-200 hover:bg-blue-500/30 text-xs font-semibold"
                  >
                    🏨 Hotels
                  </button>
                  <button
                    onClick={() => setCategory("Coaching & Institute")}
                    className="px-3 py-1.5 rounded-xl bg-purple-500/20 border border-purple-400/40 text-purple-200 hover:bg-purple-500/30 text-xs font-semibold"
                  >
                    🎓 Coaching
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MAIN CONTENT */}
          <main className="max-w-[1380px] w-full mx-auto px-3 sm:px-6 py-4 flex-1 grid grid-cols-1 lg:grid-cols-[1.25fr_0.75fr] gap-5 items-start">
            {/* LEFT: LISTINGS */}
            <section className="space-y-3">
              <div className="flex items-center justify-between text-xs text-stone-600 px-1">
                <span>
                  Showing <b>{displayedPlaces.length}</b> results in <b>{selectedLoc.name}</b> {category !== "All" && `(${category})`}
                </span>
                <span>Click on ⭐ Review to add your rating</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                {displayedPlaces.map((item) => {
                  const itemReviews = reviewsMap[item.id] || item.reviewList || [];
                  const totalRevs = item.reviews + itemReviews.length;
                  const isSaved = savedIds.includes(item.id);

                  return (
                    <div
                      key={item.id}
                      className="bg-white rounded-2xl border border-orange-200/90 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between"
                    >
                      <div>
                        {/* Category & Rating Header */}
                        <div className="flex items-center justify-between gap-2 mb-2">
                          <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${getCategoryBadgeStyle(item.category)}`}>
                            {getCategoryIcon(item.category)} {item.category}
                          </span>
                          <div className="flex items-center gap-1.5">

                              className="inline-flex items-center gap-1 text-xs font-bold bg-amber-50 hover:bg-amber-100 border border-amber-200 px-2 py-0.5 rounded-full text-stone-800 transition"
                              title="Click to read or write reviews"
                            >
                              ⭐ {item.rating} <span className="text-[10px] font-normal text-stone-500">({totalRevs})</span>

                                setSavedIds(next);

                              className={`text-xs px-1.5 py-0.5 rounded-lg border ${isSaved ? "bg-red-50 border-red-200 text-red-500" : "border-stone-200 text-stone-400"}`}

                              {isSaved ? "❤️" : "🤍"}
                            </button>
                          </div>
                        </div>

                        <h3 className="font-bold text-[15px] text-stone-900 leading-snug">

                        {/* Description */}
                        <p className="text-xs text-stone-600 mt-1.5 line-clamp-2 leading-relaxed">

                        <button

                      }
                    }}
                    className="text-xs px-2.5 py-1 rounded-full bg-orange-50 text-orange-700 border border-orange-200 font-semibold"
                  >
                    🎯 Center Map
                  </button>
                </div>
                <div id="mainMap" className="w-full h-[420px] bg-orange-50"></div>
              </div>
            </aside>
          </main>

          {/* ==========================================
              8. REVIEW & RATING MODAL
          ========================================== */}
          {reviewTarget && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-orange-200 shadow-2xl w-full max-w-md p-6 relative max-h-[90vh] overflow-auto">
                <button
                  onClick={() => setReviewTarget(null)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 grid place-items-center text-stone-600"
                >
                  ✕
                </button>
                <span className="text-xs font-bold text-orange-600 uppercase">{reviewTarget.category}</span>
                <h3 className="font-display font-bold text-lg text-stone-900 mt-0.5">{reviewTarget.name}</h3>
                <p className="text-xs text-stone-500">📍 {reviewTarget.city}, {reviewTarget.state}</p>

                <form onSubmit={handleReviewSubmit} className="mt-4 space-y-3 bg-orange-50/60 p-3.5 rounded-2xl border border-orange-200">
                  <div className="text-xs font-bold text-stone-800">Apni Rating aur Review Dein:</div>
                  <div className="flex items-center gap-2">
                    {[5, 4, 3, 2, 1].map(num => (
                      <button
                        type="button"
                        key={num}
                        onClick={() => setNewReview({ ...newReview, stars: num })}
                        className={`px-2.5 py-1 rounded-lg text-xs font-bold border ${
                          newReview.stars === num ? "bg-orange-500 text-white border-orange-500" : "bg-white text-stone-700 border-orange-200"
                        }`}
                      >
                        {num} ⭐
                      </button>
                    ))}
                  </div>
                  <textarea
                    rows="2"
                    value={newReview.text}
                    onChange={(e) => setNewReview({ ...newReview, text: e.target.value })}
                    placeholder="Yahan apna anubhav likhein (Jaise: Doctor bahut acche hain / Best coaching)..."
                    className="w-full px-3 py-2 rounded-xl border border-orange-200 text-xs outline-none focus:border-orange-500 bg-white"
                  ></textarea>
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs shadow">
                    ✅ Submit Review
                  </button>
                </form>

                <div className="mt-4 space-y-2">
                  <div className="text-xs font-bold text-stone-700">Recent User Reviews:</div>
                  {(reviewsMap[reviewTarget.id] || reviewTarget.reviewList || []).length === 0 ? (
                    <div className="text-xs text-stone-400 italic">Abhi tak koi text review nahi hai. Sabse pehle aap review dein!</div>
                  ) : (
                    (reviewsMap[reviewTarget.id] || reviewTarget.reviewList || []).map((r, i) => (
                      <div key={i} className="p-2.5 rounded-xl bg-stone-50 border border-stone-200 text-xs">
                        <div className="flex justify-between font-bold text-stone-800">
                          <span>👤 {r.user}</span>
                          <span className="text-amber-600">{"⭐".repeat(r.stars)}</span>
                        </div>
                        <p className="text-stone-600 mt-1">{r.text}</p>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ==========================================
              9. CLOUD DATABASE CONNECTOR MODAL (FIREBASE / SUPABASE)
          ========================================== */}
          {cloudModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-orange-200 shadow-2xl w-full max-w-lg p-6 relative">
                <button
                  onClick={() => setCloudModal(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 grid place-items-center text-stone-600"
                >
                  ✕
                </button>
                <h2 className="font-display font-bold text-xl text-stone-900">
                  ☁️ Connect Live Cloud Database (Firebase / Supabase)
                </h2>
                <p className="text-xs text-stone-500 mt-1">
                  Apna Firebase Realtime Database ya Supabase URL yahan dalein taki har user dwara add kiya gaya Hospital, Hotel ya Shop pure India me live dikhe.
                </p>

                <div className="mt-4 space-y-3">
                  <div className="grid grid-cols-2 gap-2 p-1 bg-orange-50 rounded-xl border border-orange-200">
                    <button
                      type="button"
                      onClick={() => setCloudConfig({ ...cloudConfig, provider: "firebase" })}
                      className={`py-2 rounded-lg text-xs font-bold ${cloudConfig.provider === "firebase" ? "bg-orange-500 text-white" : "text-stone-600"}`}
                    >
                      🔥 Firebase Realtime DB
                    </button>
                    <button
                      type="button"
                      onClick={() => setCloudConfig({ ...cloudConfig, provider: "supabase" })}
                      className={`py-2 rounded-lg text-xs font-bold ${cloudConfig.provider === "supabase" ? "bg-orange-500 text-white" : "text-stone-600"}`}
                    >
                      ⚡ Supabase REST API
                    </button>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-stone-700">
                      {cloudConfig.provider === "firebase"
                        ? "Firebase Database URL (e.g. https://your-project-default-rtdb.firebaseio.com)"
                        : "Supabase Project URL (e.g. https://xyzcompany.supabase.co)"}
                    </label>
                    <input
                      type="url"
                      value={cloudConfig.url}
                      onChange={(e) => setCloudConfig({ ...cloudConfig, url: e.target.value })}
                      placeholder="https://..."
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm outline-none focus:border-orange-500"
                    />
                  </div>

                  {cloudConfig.provider === "supabase" && (
                    <div>
                      <label className="text-xs font-semibold text-stone-700">Supabase Anon Public Key</label>
                      <input
                        type="text"
                        value={cloudConfig.apiKey}
                        onChange={(e) => setCloudConfig({ ...cloudConfig, apiKey: e.target.value })}
                        placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI..."
                        className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm outline-none focus:border-orange-500"
                      />
                    </div>
                  )}

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        const next = { ...cloudConfig, enabled: Boolean(cloudConfig.url.trim()) };
                        setCloudConfig(next);
                        localStorage.setItem("sahirank_v18_cloud", JSON.stringify(next));
                        setCloudModal(false);
                        showToast(next.enabled ? "☁️ Cloud Database Connected & Active!" : "💾 LocalStorage Mode Active");
                      }}
                      className="flex-1 py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm shadow"
                    >
                      ✅ Save & Sync Database
                    </button>
                    {cloudConfig.enabled && (
                      <button
                        type="button"
                        onClick={() => {
                          const reset = { provider: "firebase", url: "", apiKey: "", enabled: false };
                          setCloudConfig(reset);
                          localStorage.setItem("sahirank_v18_cloud", JSON.stringify(reset));
                          setCloudModal(false);
                          showToast("Cloud Disconnected. Running on LocalStorage.");
                        }}
                        className="px-4 py-3 rounded-xl bg-red-50 text-red-600 font-bold text-xs border border-red-200"
                      >
                        Disconnect
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ==========================================
              10. LOGIN / SIGN UP MODAL
          ========================================== */}
          {authModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-orange-200 shadow-2xl w-full max-w-md p-6 relative">
                <button
                  onClick={() => setAuthModal(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 grid place-items-center text-stone-600"
                >
                  ✕
                </button>
                <h2 className="font-display font-bold text-xl text-stone-900 text-center">
                  {authMode === "login" ? "🔐 Login to SahiRank" : "✨ Create New Account"}
                </h2>
                <div className="grid grid-cols-2 gap-1 p-1 bg-orange-50 rounded-xl border border-orange-200 my-4">
                  <button
                    type="button"
                    onClick={() => setAuthMode("login")}
                    className={`py-2 rounded-lg text-xs font-bold ${authMode === "login" ? "bg-orange-500 text-white" : "text-stone-600"}`}
                  >
                    Login
                  </button>
                  <button
                    type="button"
                    onClick={() => setAuthMode("signup")}
                    className={`py-2 rounded-lg text-xs font-bold ${authMode === "signup" ? "bg-orange-500 text-white" : "text-stone-600"}`}
                  >
                    Sign Up
                  </button>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-3">
                  {authMode === "signup" && (
                    <input
                      type="text"
                      required
                      value={authForm.name}
                      onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })}
                      placeholder="Aapka Pura Naam *"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                    />
                  )}
                  <input
                    type="text"
                    required
                    value={authForm.phoneOrEmail}
                    onChange={(e) => setAuthForm({ ...authForm, phoneOrEmail: e.target.value })}
                    placeholder="Mobile Number ya Email ID *"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                  />
                  <input
                    type="password"
                    required
                    value={authForm.password}
                    onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                    placeholder="Password *"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                  />
                  <button type="submit" className="w-full py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm shadow">
                    {authMode === "login" ? "✅ Login Karein" : "🚀 Sign Up Karein"}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================
              11. ADD HOSPITAL / HOTEL / COACHING / PLACE MODAL
          ========================================== */}
          {addModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-orange-200 shadow-2xl w-full max-w-lg p-6 max-h-[92vh] overflow-auto relative">
                <button
                  onClick={() => setAddModal(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 grid place-items-center text-stone-600"
                >
                  ✕
                </button>
                <h2 className="font-display font-bold text-xl text-stone-900 mb-1">
                  ➕ Add Hospital, Hotel, Coaching ya Shop
                </h2>
                <form onSubmit={handleAddBusiness} className="space-y-3 mt-3">
                  <div>
                    <label className="text-xs font-semibold text-stone-700">Name (Hospital / Coaching / Hotel / Landmark) *</label>
                    <input
                      type="text"
                      required
                      value={bizForm.name}
                      onChange={(e) => setBizForm({ ...bizForm, name: e.target.value })}
                      placeholder="Jaise: Apex Hospital, Allen Coaching, Hotel Surya..."
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                    />
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-stone-700">Category *</label>
                      <select
                        value={bizForm.category}
                        onChange={(e) => setBizForm({ ...bizForm, category: e.target.value })}
                        className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 bg-white text-sm"
                      >
                        {CATEGORIES.filter(c => c.id !== "All").map(c => (
                          <option key={c.id} value={c.id}>{c.label}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-stone-700">Phone / Helpline</label>
                      <input
                        type="text"
                        value={bizForm.phone}
                        onChange={(e) => setBizForm({ ...bizForm, phone: e.target.value })}
                        placeholder="+91 98765 43210"
                        className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-stone-700">City / Zila / Gaon *</label>
                    <div className="mt-1">
                      <LocationPicker
                        value={bizForm.cityLoc?.display || ""}
                        onSelect={(loc) => setBizForm({ ...bizForm, cityLoc: loc })}
                        placeholder="City ya Gaon chunein..."
                        allowCustom={true}
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-stone-700">Specialty / Famous Tagline</label>
                    <input
                      type="text"
                      value={bizForm.famousTag}
                      onChange={(e) => setBizForm({ ...bizForm, famousTag: e.target.value })}
                      placeholder="Jaise: 24x7 ICU & Trauma Center / Best NEET Coaching"
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-stone-700">Address & Details</label>
                    <input
                      type="text"
                      value={bizForm.address}
                      onChange={(e) => setBizForm({ ...bizForm, address: e.target.value })}
                      placeholder="Near Station Road, Civil Lines..."
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                    />
                  </div>
                  <button type="submit" className="w-full py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm shadow">
                    ✅ Publish Listing Now
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* TOAST */}
          {toast && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-stone-900 text-white text-xs sm:text-sm font-semibold shadow-2xl border border-orange-400">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
