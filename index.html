    function calculateSahiRank(biz) {
      const revs = biz.reviews || [];
      if (revs.length === 0) return { avgRating: 4.5, trustScore: 80, rankScore: 50 };
      const totalStars = revs.reduce((acc, r) => acc + r.stars, 0);
      const avgRating = Number((totalStars / revs.length).toFixed(1));
      const posCount = revs.filter(r => r.stars >= 4).length;
      const verifiedCount = revs.filter(r => r.verifiedBill).length;

      const posRatio = (posCount / revs.length) * 60;
      const verBonus = (verifiedCount / revs.length) * 25;
      const claimBonus = biz.claimed ? 15 : 5;
      const trustScore = Math.min(99, Math.round(posRatio + verBonus + claimBonus));

      const sponsorBoost = biz.isSponsored ? 1000 : 0;
      const rankScore = sponsorBoost + trustScore * 5 + (biz.searchAppearances || 0) * 0.05;

      return { avgRating, trustScore, rankScore };
    }

                    <p className="text-xs text-orange-100 mt-0.5">Yahan sirf <b>{selectedCity.name}</b> ke local hospitals, showrooms aur dukanen dikh rahi hain jinhe aap direct Map par pin-point dekh sakte hain.</p>
                  </div>
                  <button onClick={() => setSuggestModal(true)} className="px-4 py-2.5 rounded-xl bg-white text-orange-700 font-bold text-xs shadow shrink-0">
                    ➕ Add Your Shop
                  </button>
                </div>

                <div className="space-y-3.5">
                  {cityBusinesses.map((biz, index) => {
                    const posRevs = (biz.reviews || []).filter(r => r.stars >= 4);
                    const negRevs = (biz.reviews || []).filter(r => r.stars <= 3);

                    return (
                      <div key={biz.id} className="bg-white rounded-3xl border-2 border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                        <div>
                          <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 rounded bg-slate-900 text-white font-extrabold text-xs">#{index + 1}</span>
                              {biz.verifiedBadge && <span className="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-bold text-[11px]">🛡️ Verified Blue Badge</span>}
                              <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-bold text-[11px]">{biz.category}</span>
                            </div>
                            <span className="text-xs font-bold text-emerald-700">⭐ {biz.metrics.avgRating} ({biz.reviews.length})</span>
                          </div>

                          <h3 className="font-bold text-lg text-slate-900">{biz.name}</h3>
                          <p className="text-xs text-slate-500 mt-0.5">📍 {biz.address} • 📞 {biz.phone}</p>

                          {/* POSITIVE REVIEWS */}
                          <div className="mt-3 space-y-1.5">
                            {posRevs.slice(0, 1).map(r => (
                              <div key={r.id} className="p-2.5 rounded-xl bg-emerald-50 text-xs text-slate-700">
                                <b>👤 {r.user}:</b> "{r.text}"
                              </div>
                            ))}
                          </div>

                          {/* NEGATIVE REVIEWS (PAYWALL) */}
                          {negRevs.length > 0 && (
                            <div className="mt-2 relative">
                              <div className="blur-lock space-y-1">
                                {negRevs.map(r => (
                                  <div key={r.id} className="p-2 rounded-xl bg-red-50 text-xs text-red-800"><b>{r.user}:</b> {r.text}</div>
                                ))}
                              </div>
                              <div className="absolute inset-0 flex items-center justify-center bg-white/70 backdrop-blur-[1px] rounded-xl">
                                <button
                                  onClick={() => setPaymentModal({
                                    title: `Unlock Negative Reviews — ${biz.name}`,
                                    amount: 49,
                                    onSuccess: () => { processRevenueTransaction("Negative Review Unlock", 49); showToast("🔓 Unlocked!"); }
                                  })}
                                  className="px-3 py-1.5 rounded-lg bg-red-600 text-white font-bold text-xs shadow"
                                >
                                  🔒 1 Negative Feedback Hidden (Unlock ₹49)
                                </button>
                              </div>
                            </div>
                          )}
                        </div>

                        {/* MAP DIRECTIONS BUTTON & ACTIONS */}
                        <div className="mt-4 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                          <a
                            href={`https://www.google.com/maps/dir/?api=1&destination=${biz.lat},${biz.lng}`}
                            target="_blank"
                            rel="noreferrer"
                            className="flex-1 py-2.5 px-3 rounded-xl bg-orange-600 hover:bg-orange-500 text-white text-center font-bold text-xs shadow transition flex items-center justify-center gap-1.5"
                          >
                            <span>🧭</span> Get Directions (Google Maps)
                          </a>
                          <button
                            onClick={() => setReviewModalBiz(biz)}
                            className="py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs transition"
                          >
                            ✍️ Write Review
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* RIGHT: INTERACTIVE MAP PIN-POINT VIEW */}
              <aside className="lg:sticky lg:top-24 space-y-3">
                <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                  <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                    <div className="text-sm font-bold text-slate-900">
                      📍 {selectedCity.name} Live Map & Pinpoints ({cityBusinesses.length})
                    </div>
                  </div>
                  <div id="mainMap" className="w-full h-[500px] bg-slate-100"></div>
                </div>
              </aside>
            </main>
          )}

          {/* ==========================================
              VIEW 2: BUSINESS OWNER TRAFFIC & MONETIZATION DASHBOARD
          ========================================== */}
          {activeTab === "business_dashboard" && (
            <main className="max-w-[1200px] w-full mx-auto px-3 sm:px-6 py-6 flex-1 space-y-6">
              <div className="bg-blue-950 text-white rounded-3xl p-6 shadow-xl">
                <span className="px-3 py-1 rounded-full bg-blue-500/30 text-blue-200 text-xs font-bold">🏪 Business Owner High-Yield Monetization</span>
                <h1 className="font-display font-bold text-2xl mt-2">Apne {selectedCity.name} Business Ko Top Par Layein</h1>
                <p className="text-xs text-blue-200 mt-1">Dukan malik apne business ke liye **Verified Badge (₹1,499)** aur **City Spotlight Banner (₹2,999/mo)** kharid sakte hain jisse unhe sabse zyada customer leads milegi.</p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm space-y-3">
                  <div className="text-xs font-bold text-orange-600 uppercase">Option A: Verified Trust Badge</div>
                  <h3 className="font-bold text-lg text-slate-900">Blue Verified Trust Tick (₹1,499 One-Time)</h3>
                  <p className="text-xs text-slate-600">Aapki dukan/hospital ke naam ke aage official verified badge dikhega jisse customers 3x zyada bharosa karenge.</p>
                  <button
                    onClick={() => setPaymentModal({
                      title: "Verified Blue Badge Setup",
                      amount: 1499,
                      onSuccess: () => { processRevenueTransaction("Verified Badge", 1499); showToast("✅ Verified Badge Activated!"); }
                    })}
                    className="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs"
                  >
                    Buy Verified Badge (₹1,499)
                  </button>
                </div>

                <div className="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm space-y-3">
                  <div className="text-xs font-bold text-amber-600 uppercase">Option B: City Spotlight Banner</div>
                  <h3 className="font-bold text-lg text-slate-900">#1 Top Spotlight Banner in {selectedCity.name} (₹2,999/mo)</h3>
                  <p className="text-xs text-slate-600">Jab bhi koi user {selectedCity.name} me khojega, aapki dukan sabse upar banner me dikhegi.</p>
                  <button
                    onClick={() => setPaymentModal({
                      title: `City Spotlight Banner — ${selectedCity.name}`,
                      amount: 2999,
                      onSuccess: () => { processRevenueTransaction("Spotlight Banner", 2999); showToast("⚡ Spotlight Banner Active!"); }
                    })}
                    className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-xs"
                  >
                    Activate Spotlight (₹2,999/mo)
                  </button>
                </div>
              </div>
            </main>
          )}

          {/* ADMIN HQ */}
          {activeTab === "secret_admin" && (
            <main className="max-w-[1200px] w-full mx-auto px-3 sm:px-6 py-6 flex-1 space-y-6">
              <div className="bg-emerald-950 text-white rounded-3xl p-6 shadow-xl">
                <h1 className="font-display font-bold text-2xl">👑 Founder Revenue Ledger</h1>
                <div className="text-3xl font-extrabold text-emerald-400 mt-2">₹{platformLedger.adminNetProfit80Pct}</div>
              </div>
            </main>
          )}

          {/* MODALS */}
          {authModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl w-full max-w-md p-6 relative">
                <button onClick={() => setAuthModal(false)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 grid place-items-center">✕</button>
                <h2 className="font-display font-bold text-xl text-slate-900 text-center">Login to SahiRank</h2>
                <form onSubmit={handleAuthSubmit} className="mt-4 space-y-3">
                  <input type="text" required value={authForm.emailOrPhone} onChange={(e) => setAuthForm({ ...authForm, emailOrPhone: e.target.value })} placeholder="Email or Mobile *" className="w-full px-3.5 py-2.5 rounded-xl border text-xs" />
                  <input type="password" required value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} placeholder="Password *" className="w-full px-3.5 py-2.5 rounded-xl border text-xs" />
                  <button type="submit" className="w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-xs">Login</button>
                </form>
              </div>
            </div>
          )}

          {paymentModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl w-full max-w-md p-6 relative text-center">
                <button onClick={() => setPaymentModal(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 grid place-items-center">✕</button>
                <h3 className="font-bold text-lg text-slate-900">{paymentModal.title}</h3>
                <div className="text-3xl font-extrabold text-slate-900 my-3">₹{paymentModal.amount}</div>
                <button onClick={() => { paymentModal.onSuccess(); setPaymentModal(null); }} className="w-full py-3 rounded-xl bg-emerald-600 text-white font-bold text-xs">
                  Pay ₹{paymentModal.amount} Instantly
                </button>
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl bg-slate-900 text-white text-xs sm:text-sm font-bold shadow-2xl border border-orange-500">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
