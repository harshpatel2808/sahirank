      "Medical",
      "Clothes & Saree",
      "Jewellery"
    ];

    // ==========================================
    // 5. LOCATION AUTOCOMPLETE COMPONENT
    // ==========================================
    function LocationPicker({ value, onSelect, placeholder, allowCustom = false }) {
      const [query, setQuery] = useState(value);
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      useEffect(() => { setQuery(value); }, [value]);

      useEffect(() => {
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", handler);
        return () => document.removeEventListener("mousedown", handler);
      }, []);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q || q.includes("all india")) return ALL_LOCATIONS.slice(0, 18);
        return ALL_LOCATIONS.filter(loc =>
          loc.display.toLowerCase().includes(q) ||
          loc.name.toLowerCase().includes(q) ||
          loc.district.toLowerCase().includes(q) ||
          loc.state.toLowerCase().includes(q)
        ).sort((a, b) => {
          if (a.name === "All India") return -1;
          if (b.name === "All India") return 1;
          const aStarts = a.name.toLowerCase().startsWith(q) ? -1 : 0;
          const bStarts = b.name.toLowerCase().startsWith(q) ? -1 : 0;
          return aStarts - bStarts;
        }).slice(0, 20);
      }, [query]);

      const canAddCustom = allowCustom && query.trim().length > 2 && !ALL_LOCATIONS.some(l => l.name.toLowerCase() === query.trim().toLowerCase());

      return (
        <div ref={ref} className="relative w-full">
          <div className={`flex items-center gap-2 px-3.5 py-2.5 rounded-xl border-2 bg-white transition-all ${open ? "border-orange-500 ring-4 ring-orange-500/15" : "border-orange-200"}`}>
            <span className="text-orange-500 text-base">📍</span>
            <input
              value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => {
                if (query.includes("All India")) setQuery("");
                setOpen(true);
              }}
              placeholder={placeholder}
              className="flex-1 bg-transparent outline-none text-sm font-medium text-stone-900 placeholder:text-stone-400"
            />
            {query && (
              <button
                type="button"
                onClick={() => { setQuery(""); setOpen(true); }}
                className="text-xs px-1.5 py-0.5 rounded bg-stone-100 hover:bg-stone-200 text-stone-600"
              >
                ✕
              </button>
            )}
          </div>

          {open && (
            <div className="absolute z-50 mt-2 w-full bg-white border border-orange-200 rounded-2xl shadow-2xl max-h-72 overflow-auto p-2">
              {filtered.map((loc, idx) => (
                <button
                  type="button"
                  key={idx + loc.display}
                  onClick={() => { onSelect(loc); setQuery(loc.display); setOpen(false); }}
                  className="w-full text-left px-3 py-2.5 rounded-xl hover:bg-orange-50 flex items-start gap-2.5 transition"
                >
                  <span className="text-base">{loc.name === "All India" ? "🌍" : "📍"}</span>
                  <div className="flex-1">
                    <div className="text-sm font-semibold text-stone-900">{loc.display}</div>
                    <div className="text-[11px] text-stone-500">{loc.state} • {loc.district} • Famous Spots & Shops Available</div>
                  </div>
                </button>
              ))}
              {canAddCustom && (
                <button
                  type="button"
                  onClick={() => {
                    const customLoc = { name: query.trim(), district: query.trim(), state: "India", display: `${query.trim()} - India` };
                    onSelect(customLoc);
                    setOpen(false);
                  }}
                  className="w-full text-left px-3 py-2.5 rounded-xl bg-orange-50 border border-dashed border-orange-400 mt-1 flex items-center gap-2 text-xs font-semibold text-orange-800"
                >
                  <span>➕</span>
                  <span>'{query.trim()}' ko naye shehar/gaon ke roop me kholo</span>
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. MAIN APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Auth State (Saved in LocalStorage)
      const [users, setUsers] = useState(() => {
        try { return JSON.parse(localStorage.getItem("sahirank_users")) || []; } catch { return []; }
      });
      const [currentUser, setCurrentUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem("sahirank_current_user")) || null; } catch { return null; }
      });
      const [authModal, setAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState("login"); // 'login' | 'signup'
      const [authForm, setAuthForm] = useState({ name: "", phoneOrEmail: "", password: "", city: "Varanasi" });

      // Places State (Saved in LocalStorage)
      const [customPlaces, setCustomPlaces] = useState(() => {
        try { return JSON.parse(localStorage.getItem("sahirank_custom_places")) || []; } catch { return []; }
      });
      const [savedIds, setSavedIds] = useState(() => {
        try { return JSON.parse(localStorage.getItem("sahirank_saved_ids")) || []; } catch { return []; }
      });

      // Filters & Navigation
      const [selectedLoc, setSelectedLoc] = useState(ALL_LOCATIONS[0]);
      const [category, setCategory] = useState("All");
      const [searchText, setSearchText] = useState("");
      const [toast, setToast] = useState(null);
      const [addModal, setAddModal] = useState(false);
      const [selectedDetailPlace, setSelectedDetailPlace] = useState(null);

      // Live Internet Wiki / Geo Data for any clicked city
      const [cityWiki, setCityWiki] = useState(null);
      const [loadingWiki, setLoadingWiki] = useState(false);
      const [dynamicCoords, setDynamicCoords] = useState({ lat: 22.5937, lng: 78.9629 });

      // New Business Form
      const [bizForm, setBizForm] = useState({
        name: "",
        category: "Famous Landmark",
        cityLoc: ALL_LOCATIONS[1],
        phone: "",
        famousTag: "",
        desc: "",
        address: ""
      });

      // Map Refs
      const mapRef = useRef(null);
      const markersRef = useRef([]);

      const showToast = (msg) => {
        setToast(msg);
      };

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3000);
        return () => clearTimeout(timer);
      }, [toast]);

      // Resolve Coordinates + Live Nominatim Fallback + Wikipedia Summary Fetch
      useEffect(() => {
        const rawName = selectedLoc.name.replace(/\(.*\)/, "").trim().toLowerCase();
        const stateName = selectedLoc.state.toLowerCase();
        let resolved = COORDS_DB[selectedLoc.name.toLowerCase()] || COORDS_DB[rawName] || COORDS_DB[stateName] || { lat: 25.3176, lng: 82.9739 };
        setDynamicCoords(resolved);

        if (selectedLoc.name === "All India") {
          setCityWiki(null);
          return;
        }

        // Fetch Wikipedia Summary & Accurate Coordinates from Internet
        let isMounted = true;
        setLoadingWiki(true);
        const cleanCity = selectedLoc.name.replace(/\(.*\)/, "").trim();

        fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanCity)}`)
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (!isMounted) return;
            if (data && data.extract) {
              setCityWiki({
                title: data.title,
                extract: data.extract,
                thumbnail: data.thumbnail?.source || null,
                url: data.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${cleanCity}`
              });
              if (data.coordinates) {
                setDynamicCoords({ lat: data.coordinates.lat, lng: data.coordinates.lon });
              }
            } else {
              setCityWiki(null);
            }
          })
          .catch(() => { if (isMounted) setCityWiki(null); })
          .finally(() => { if (isMounted) setLoadingWiki(false); });

        return () => { isMounted = false; };
      }, [selectedLoc]);

      // Combine Curated + User Added + Auto-Generated Famous Places for Selected City
      const allDisplayedPlaces = useMemo(() => {
        const combined = [...customPlaces, ...INITIAL_PLACES];

        let list = combined;
        if (selectedLoc.name !== "All India") {
          const cleanName = selectedLoc.name.replace(/\(.*\)/, "").trim().toLowerCase();
          const cityMatches = combined.filter(p =>
            p.city.toLowerCase() === cleanName ||
            p.city.toLowerCase() === selectedLoc.name.toLowerCase() ||
            p.district.toLowerCase() === cleanName
          );

          // Guaranteed Famous Places even if city has 0 users/listings!
          const generated = generateCityHighlights(selectedLoc, dynamicCoords);
          if (cityMatches.length === 0) {
            list = generated;
          } else if (cityMatches.length < 3) {
            list = [...cityMatches, ...generated.slice(0, 3)];
          } else {
            list = cityMatches;
          }
        }

        if (category !== "All") {
          list = list.filter(p => p.category === category);
        }

        if (searchText.trim()) {
          const q = searchText.trim().toLowerCase();
          list = list.filter(p =>
            `${p.name} ${p.category} ${p.city} ${p.state} ${p.famousTag || ""} ${p.desc || ""}`.toLowerCase().includes(q)
          );
        }

        return list;
      }, [customPlaces, selectedLoc, category, searchText, dynamicCoords]);

      // Initialize & Sync Leaflet Map
      useEffect(() => {
        if (!window.L) return;
        const container = document.getElementById("mainMap");
        if (!container) return;

        if (!mapRef.current) {
          mapRef.current = window.L.map("mainMap").setView([dynamicCoords.lat, dynamicCoords.lng], selectedLoc.name === "All India" ? 5 : 13);
          window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap contributors",
            maxZoom: 19
          }).addTo(mapRef.current);
        } else {
          const zoom = selectedLoc.name === "All India" ? 5 : 13;
          mapRef.current.setView([dynamicCoords.lat, dynamicCoords.lng], zoom);
        }

        // Clear old markers
        markersRef.current.forEach(m => { try { m.remove(); } catch {} });
        markersRef.current = [];

        allDisplayedPlaces.forEach(p => {
          const marker = window.L.marker([p.lat, p.lng])
            .addTo(mapRef.current)
            .bindPopup(`
              <div style="min-width:180px">
                <b style="color:#ff6b02;font-size:13px">${p.name}</b><br/>
                <span style="font-size:11px;color:#555">${p.famousTag || p.category}</span><br/>
                <span style="font-size:11px">📍 ${p.city}, ${p.state} • ⭐ ${p.rating}</span><br/>
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' ' + p.city)}" target="_blank" style="color:#ff6b02;font-weight:bold;font-size:11px">Google Maps par kholein →</a>
              </div>
            `);
          markersRef.current.push(marker);
        });
      }, [dynamicCoords, allDisplayedPlaces, selectedLoc]);

      // Auth Handlers
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const { name, phoneOrEmail, password, city } = authForm;
        if (!phoneOrEmail.trim() || !password.trim()) {
          showToast("⚠️ Email/Phone aur Password zaroor bharein!");
          return;
        }

        if (authMode === "signup") {
          if (!name.trim()) {
            showToast("⚠️ Apna Naam bharein!");
            return;
          }
          if (users.some(u => u.phoneOrEmail.toLowerCase() === phoneOrEmail.trim().toLowerCase())) {
            showToast("⚠️ Yeh Email/Phone pehle se registered hai. Kripya Login karein.");
            setAuthMode("login");
            return;
          }
          const newUser = { id: Date.now(), name: name.trim(), phoneOrEmail: phoneOrEmail.trim(), password, city };
          const updatedUsers = [...users, newUser];
          setUsers(updatedUsers);
          setCurrentUser(newUser);
          localStorage.setItem("sahirank_users", JSON.stringify(updatedUsers));
          localStorage.setItem("sahirank_current_user", JSON.stringify(newUser));
          setAuthModal(false);
          showToast(`🎉 Welcome ${newUser.name}! Aapka account ban gaya.`);
        } else {
          const found = users.find(
            u => u.phoneOrEmail.toLowerCase() === phoneOrEmail.trim().toLowerCase() && u.password === password
          );
          if (!found) {
            showToast("❌ Galat Email/Phone ya Password! Naya account banane ke liye Sign Up par click karein.");
            return;
          }
          setCurrentUser(found);
          localStorage.setItem("sahirank_current_user", JSON.stringify(found));
          setAuthModal(false);
          showToast(`✅ Welcome back, ${found.name}!`);
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem("sahirank_current_user");
        showToast("👋 Aap safaltapurvak Logout ho gaye.");
      };

      // Add Place / Business Handler
      const handleAddBusiness = (e) => {
        e.preventDefault();
        if (!bizForm.name.trim() || !bizForm.cityLoc) {
          showToast("⚠️ Naam aur City select karna zaroori hai!");
          return;
        }
        const loc = bizForm.cityLoc;
        const cleanName = loc.name.replace(/\(.*\)/, "").trim().toLowerCase();
        const baseCoord = COORDS_DB[cleanName] || COORDS_DB[loc.state.toLowerCase()] || dynamicCoords;

        const newEntry = {
          id: Date.now(),
          name: bizForm.name.trim(),
          category: bizForm.category,
          city: loc.name,
          district: loc.district,
          state: loc.state,
          lat: baseCoord.lat + (Math.random() - 0.5) * 0.015,
          lng: baseCoord.lng + (Math.random() - 0.5) * 0.015,
          rating: 4.9,
          reviews: 1,
          phone: bizForm.phone || "+91 98765 XXXXX",
          open: true,
          isFamous: bizForm.category.startsWith("Famous"),
          famousTag: bizForm.famousTag || `Popular ${bizForm.category} in ${loc.name}`,
          desc: bizForm.desc || `${loc.name} me sthit bharosemand aur mashhoor sthan.`,
          address: bizForm.address || `Main Market, ${loc.name}, ${loc.state}`,
          addedBy: currentUser ? currentUser.name : "Guest User"
        };

        const updated = [newEntry, ...customPlaces];
        setCustomPlaces(updated);
        localStorage.setItem("sahirank_custom_places", JSON.stringify(updated));
        setSelectedLoc(loc);
        setAddModal(false);
        setBizForm({ name: "", category: "Famous Landmark", cityLoc: loc, phone: "", famousTag: "", desc: "", address: "" });
        showToast(`✅ '${newEntry.name}' ab ${loc.name} me live ho gaya!`);
      };

      const toggleSavePlace = (id) => {
        const updated = savedIds.includes(id) ? savedIds.filter(x => x !== id) : [...savedIds, id];
        setSavedIds(updated);
        localStorage.setItem("sahirank_saved_ids", JSON.stringify(updated));
        showToast(savedIds.includes(id) ? "Bookmark hata diya gaya" : "❤️ Saved list me jud gaya!");
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-orange-200 shadow-sm">
            <div className="max-w-[1360px] mx-auto px-3 sm:px-6 py-3 flex flex-col lg:flex-row gap-3 items-stretch lg:items-center">
              {/* Brand Logo */}
              <div className="flex items-center justify-between gap-3 shrink-0">
                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setSelectedLoc(ALL_LOCATIONS[0])}>
                  <div className="w-10 h-10 rounded-xl bg-orange-500 grid place-items-center text-white font-bold text-lg shadow">
                    S
                  </div>
                  <div>
                    <div className="font-display font-bold text-lg leading-none">
                      SahiRank <span className="text-orange-500">V17 Pro</span>
                    </div>
                    <div className="text-[10px] text-stone-500 tracking-wider uppercase font-semibold mt-0.5">
                      28 States • 8 UTs • Famous Places & Shops
                    </div>
                  </div>
                </div>

                {/* Mobile Auth Button */}
                <div className="flex lg:hidden items-center gap-2">
                  {currentUser ? (
                    <button onClick={handleLogout} className="text-xs px-3 py-1.5 rounded-xl bg-orange-100 text-orange-800 font-semibold">
                      👤 {currentUser.name.split(" ")[0]} (Logout)
                    </button>
                  ) : (
                    <button onClick={() => { setAuthMode("login"); setAuthModal(true); }} className="text-xs px-3 py-1.5 rounded-xl bg-stone-900 text-white font-semibold">
                      🔐 Login / Sign Up
                    </button>
                  )}
                </div>
              </div>

              {/* Search Controls */}
              <div className="flex-1 flex flex-col sm:flex-row gap-2">
                <div className="flex-1 min-w-0">
                  <LocationPicker
                    value={selectedLoc.display}
                    onSelect={(loc) => {
                      setSelectedLoc(loc);
                      showToast(`📍 ${loc.name} ke Famous Spots & Locations load ho gaye!`);
                    }}
                    placeholder="📍 Koi bhi City, Zila ya Gaon chunein (Varanasi, Agra, Goa, Gyanpur...)"
                    allowCustom={true}
                  />
                </div>
                <div className="flex-1 min-w-0 flex items-center gap-2 px-3.5 py-2.5 rounded-xl border-2 border-orange-200 bg-white">
                  <span>🔍</span>
                  <input

                    onChange={(e) => setSearchText(e.target.value)}
                    placeholder="Famous chiz, mandir, food ya dukan khojein..."
                    className="flex-1 bg-transparent outline-none text-sm text-stone-900 placeholder:text-stone-400"
                  />
                  {searchText && (
                    <button onClick={() => setSearchText("")} className="text-xs text-stone-500">✕</button>

              </div>

              {/* Action Buttons (Add Place + Login/Signup) */}
              <div className="flex items-center gap-2 shrink-0">

                    setBizForm(prev => ({ ...prev, cityLoc: selectedLoc.name === "All India" ? ALL_LOCATIONS[1] : selectedLoc }));

                  }}
                  className="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-semibold text-sm shadow transition"
                >
                  <span>➕</span> Add Famous Spot / Shop
                </button>

                <div className="hidden lg:flex items-center gap-2">
                  {currentUser ? (
                    <div className="flex items-center gap-2 bg-orange-50 border border-orange-200 px-3 py-1.5 rounded-xl">
                      <div className="w-7 h-7 rounded-full bg-orange-500 text-white grid place-items-center text-xs font-bold">
                        {currentUser.name[0].toUpperCase()}
                      </div>
                      <div className="text-xs">
                        <div className="font-bold text-stone-900 leading-tight">{currentUser.name}</div>
                        <button onClick={handleLogout} className="text-[10px] text-red-600 font-semibold hover:underline">
                          Logout
                        </button>
                      </div>
                    </div>
                  ) : (
                    <button
                      onClick={() => { setAuthMode("login"); setAuthModal(true); }}
                      className="px-4 py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-semibold text-sm transition"
                    >
                      🔐 Login / Sign Up
                    </button>
                  )}
                </div>
              </div>
            </div>

            {/* Category Bar + Quick Famous Cities */}
            <div className="border-t border-orange-100 bg-orange-50/60">
              <div className="max-w-[1360px] mx-auto px-3 sm:px-6 py-2 flex items-center gap-2 overflow-x-auto">
                <span className="text-[11px] font-bold text-stone-500 uppercase shrink-0">Filter:</span>
                {CATEGORIES.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setCategory(cat)}
                    className={`shrink-0 px-3 py-1 rounded-full text-xs font-semibold border transition ${
                      category === cat
                        ? "bg-orange-500 text-white border-orange-500 shadow-sm"
                        : "bg-white text-stone-700 border-orange-200 hover:border-orange-400"
                    }`}
                  >
                    {cat === "Famous Landmark" ? "🏛️ Famous Landmarks" :
                     cat === "Famous Food" ? "🍲 Famous Food & Sweets" :
                     cat === "Famous Market" ? "🛍️ Famous Markets" : cat}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* QUICK POPULAR CITY BAR */}
          <div className="max-w-[1360px] w-full mx-auto px-3 sm:px-6 pt-3 flex items-center gap-1.5 flex-wrap text-xs">
            <span className="font-bold text-stone-600 mr-1">🔥 Popular Cities:</span>
            {["All India", "Varanasi", "Ayodhya", "Agra", "Lucknow", "Gyanpur", "Bhadohi", "Mumbai", "Delhi", "Jaipur", "Patna", "Indore", "Amritsar", "Puri", "Shillong", "Panaji"].map(city => {
              const locObj = ALL_LOCATIONS.find(l => l.name.toLowerCase() === city.toLowerCase()) || ALL_LOCATIONS[0];
              const active = selectedLoc.name.toLowerCase() === city.toLowerCase();
              return (
                <button
                  key={city}
                  onClick={() => setSelectedLoc(locObj)}
                  className={`px-2.5 py-1 rounded-full border font-medium transition ${
                    active ? "bg-stone-900 text-white border-stone-900" : "bg-white border-orange-200 hover:border-orange-500 text-stone-700"
                  }`}
                >
                  {city}
                </button>
              );
            })}
          </div>

          {/* CITY HERO & WIKIPEDIA LIVE INFO BANNER (When a specific city is selected) */}
          {selectedLoc.name !== "All India" && (
            <div className="max-w-[1360px] w-full mx-auto px-3 sm:px-6 mt-3">
              <div className="bg-gradient-to-r from-orange-500 to-amber-600 text-white rounded-2xl p-4 sm:p-5 shadow-md flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                <div className="flex items-start gap-4 flex-1">
                  {cityWiki?.thumbnail && (
                    <img
                      src={cityWiki.thumbnail}
                      alt={selectedLoc.name}
                      className="w-20 h-20 sm:w-24 sm:h-24 rounded-xl object-cover border-2 border-white/60 shrink-0 bg-white"
                    />
                  )}
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-white/20 text-[11px] font-semibold mb-1">
                      <span>✨ City Explorer Guide</span> • <span>{selectedLoc.state}</span>
                    </div>
                    <h1 className="font-display font-bold text-xl sm:text-2xl">
                      {selectedLoc.name} — Famous Places, Markets & Local Guide
                    </h1>
                    <p className="text-xs sm:text-sm text-orange-50 mt-1 line-clamp-2 max-w-3xl">
                      {loadingWiki
                        ? `Internet se ${selectedLoc.name} ki prasiddh jankari aur map locations load ho rahi hai...`
                        : cityWiki?.extract || `${selectedLoc.name} (${selectedLoc.state}) ke sabse mashhoor darshaniya sthal, prasiddh bazar, khane-peene ki jagah aur verified local shops niche diye gaye hain.`}
                    </p>
                  </div>
                </div>
                <div className="flex flex-wrap gap-2 shrink-0">
                  <a
                    href={`https://www.google.com/maps/search/Tourist+Attractions+in+${encodeURIComponent(selectedLoc.name + " " + selectedLoc.state)}`}
                    target="_blank"
                    rel="noreferrer"
                    className="px-3.5 py-2 rounded-xl bg-white text-orange-600 font-bold text-xs shadow hover:bg-orange-50"
                  >
                    🗺️ Google Maps Tourist Spots
                  </a>
                  {cityWiki?.url && (
                    <a
                      href={cityWiki.url}
                      target="_blank"
                      rel="noreferrer"
                      className="px-3.5 py-2 rounded-xl bg-black/25 hover:bg-black/35 text-white font-semibold text-xs"
                    >
                      📖 Read Wikipedia
                    </a>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MAIN CONTENT GRID */}
          <main className="max-w-[1360px] w-full mx-auto px-3 sm:px-6 py-4 flex-1 grid grid-cols-1 lg:grid-cols-[1.25fr_0.75fr] gap-5 items-start">
            {/* LEFT: CARDS LIST */}
            <section className="space-y-3">
              <div className="flex items-center justify-between text-xs text-stone-600 px-1">
                <span>
                  Showing <b>{allDisplayedPlaces.length}</b> famous places & verified locations in <b>{selectedLoc.name}</b>
                </span>
                <span>{ALL_LOCATIONS.length}+ Indian Cities & Districts Active</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                {allDisplayedPlaces.map((item) => {
                  const isSaved = savedIds.includes(item.id);
                  return (
                    <div
                      key={item.id}
                      className="bg-white rounded-2xl border border-orange-200/80 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between"
                    >
                      <div>
                        {/* Top Badges */}
                        <div className="flex items-center justify-between gap-2 mb-2">
                          <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                            item.isFamous
                              ? "bg-amber-100 text-amber-900 border border-amber-300"
                              : "bg-orange-50 text-orange-700 border border-orange-200"
                          }`}>
                            {item.isFamous ? "🌟 Famous Highlight" : `🏪 ${item.category}`}
                          </span>
                          <div className="flex items-center gap-1.5">
                            <span className="inline-flex items-center gap-1 text-xs font-bold bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full text-stone-800">
                              ⭐ {item.rating} <span className="text-[10px] font-normal text-stone-500">({item.reviews})</span>
                            </span>
                            <button
                              onClick={() => toggleSavePlace(item.id)}
                              title="Save Place"
                              className={`text-sm px-1.5 py-0.5 rounded-lg border ${isSaved ? "bg-red-50 border-red-200 text-red-500" : "border-stone-200 text-stone-400"}`}
                            >
                              {isSaved ? "❤️" : "🤍"}
                            </button>
                          </div>
                        </div>

                        {/* Title & Famous Tag */}
                        <h3 className="font-bold text-base text-stone-900 leading-snug">
                          {item.name}
                        </h3>
                        {item.famousTag && (
                          <div className="text-xs font-semibold text-orange-600 mt-0.5">
                            ✨ {item.famousTag}
                          </div>
                        )}

                        {/* Description */}
                        <p className="text-xs text-stone-600 mt-1.5 line-clamp-2 leading-relaxed">
                          {item.desc || `${item.city}, ${item.state} ka pramukh ${item.category} sthan.`}
                        </p>

                        {/* Address & Location */}
                        <div className="mt-2.5 pt-2 border-t border-orange-100 text-[11px] text-stone-500 space-y-0.5">
                          <div>📍 <b>Location:</b> {item.address || `${item.city}, ${item.district} - ${item.state}`}</div>
                          <div>📞 <b>Contact/Info:</b> {item.phone}</div>
                        </div>
                      </div>

                      {/* Action Buttons */}
                      <div className="mt-3 pt-2 flex gap-2">
                        <button
                          onClick={() => {
                            if (mapRef.current) {
                              mapRef.current.setView([item.lat, item.lng], 15);
                              showToast(`🗺️ Map centered on ${item.name}`);
                            }
                          }}
                          className="flex-1 py-2 px-2.5 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-800 border border-orange-200 text-xs font-semibold transition"
                        >
                          📍 Show on Map
                        </button>
                        <a
                          href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + " " + item.city + " " + item.state)}`}
                          target="_blank"
                          rel="noreferrer"
                          className="flex-1 py-2 px-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-center text-xs font-semibold transition"
                        >
                          🧭 Google Direction
                        </a>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* RIGHT: LIVE INTERACTIVE MAP */}
            <aside className="lg:sticky lg:top-28 space-y-3">
              <div className="bg-white rounded-2xl border border-orange-200 overflow-hidden shadow-sm">
                <div className="px-4 py-3 border-b border-orange-100 flex items-center justify-between">
                  <div className="text-sm font-bold text-stone-900 flex items-center gap-1.5">
                    <span>🗺️</span>
                    <span>{selectedLoc.name === "All India" ? "All India Live Map" : `${selectedLoc.name} Famous Map`}</span>
                  </div>
                  <button
                    onClick={() => {
                      if (mapRef.current) {
                        mapRef.current.setView([dynamicCoords.lat, dynamicCoords.lng], selectedLoc.name === "All India" ? 5 : 13);
                      }
                    }}
                    className="text-xs px-2.5 py-1 rounded-full bg-orange-50 text-orange-700 border border-orange-200 font-semibold"
                  >
                    🎯 Reset Center
                  </button>
                </div>

                <div id="mainMap" className="w-full h-[400px] bg-orange-50"></div>

                <div className="p-3 bg-orange-50/50 border-t border-orange-100 text-[11px] text-stone-600 flex items-center justify-between">
                  <span>✅ Live OpenStreetMap + Wikipedia Coordinates</span>
                  <a
                    href={`https://www.google.com/maps/search/${encodeURIComponent("Famous places in " + selectedLoc.name)}`}
                    target="_blank"
                    rel="noreferrer"
                    className="font-bold text-orange-600 hover:underline"
                  >
                    Open Full Google Earth View ↗
                  </a>
                </div>
              </div>
            </aside>
          </main>

          {/* ==========================================
              7. LOGIN & SIGN UP MODAL
          ========================================== */}
          {authModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-orange-200 shadow-2xl w-full max-w-md p-6 relative">
                <button
                  onClick={() => setAuthModal(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 grid place-items-center text-stone-600"
                >
                  ✕
                </button>

                <div className="text-center mb-5">
                  <div className="w-12 h-12 rounded-2xl bg-orange-500 text-white font-bold text-xl grid place-items-center mx-auto mb-2 shadow">
                    S
                  </div>
                  <h2 className="font-display font-bold text-xl text-stone-900">
                    {authMode === "login" ? "Welcome Back! Login Karein" : "Naya Account Banayein (Sign Up)"}
                  </h2>
                  <p className="text-xs text-stone-500 mt-1">
                    Apna business add karne, places save karne aur review dene ke liye judein.
                  </p>
                </div>

                {/* Mode Switch Tabs */}
                <div className="grid grid-cols-2 gap-1 p-1 bg-orange-50 rounded-xl border border-orange-200 mb-4">
                  <button
                    type="button"
                    onClick={() => setAuthMode("login")}
                    className={`py-2 rounded-lg text-xs font-bold transition ${authMode === "login" ? "bg-orange-500 text-white shadow" : "text-stone-600"}`}
                  >
                    🔐 Login
                  </button>
                  <button
                    type="button"
                    onClick={() => setAuthMode("signup")}
                    className={`py-2 rounded-lg text-xs font-bold transition ${authMode === "signup" ? "bg-orange-500 text-white shadow" : "text-stone-600"}`}
                  >
                    ✨ Sign Up
                  </button>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-3">
                  {authMode === "signup" && (
                    <div>
                      <label className="text-xs font-semibold text-stone-700">Aapka Pura Naam *</label>
                      <input
                        type="text"
                        required
                        value={authForm.name}
                        onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })}
                        placeholder="Jaise: Rahul Sharma"
                        className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 outline-none focus:border-orange-500 text-sm"
                      />
                    </div>
                  )}

                  <div>
                    <label className="text-xs font-semibold text-stone-700">Mobile Number ya Email ID *</label>
                    <input
                      type="text"
                      required
                      value={authForm.phoneOrEmail}
                      onChange={(e) => setAuthForm({ ...authForm, phoneOrEmail: e.target.value })}
                      placeholder="9876543210 ya rahul@gmail.com"
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 outline-none focus:border-orange-500 text-sm"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-stone-700">Password *</label>
                    <input
                      type="password"
                      required
                      value={authForm.password}
                      onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                      placeholder="••••••••"
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 outline-none focus:border-orange-500 text-sm"
                    />
                  </div>

                  {authMode === "signup" && (
                    <div>
                      <label className="text-xs font-semibold text-stone-700">Aapka Shehar / Zila</label>
                      <input
                        type="text"
                        value={authForm.city}
                        onChange={(e) => setAuthForm({ ...authForm, city: e.target.value })}
                        placeholder="Varanasi, Mumbai, Gyanpur..."
                        className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 outline-none focus:border-orange-500 text-sm"
                      />
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm shadow-md transition mt-2"
                  >
                    {authMode === "login" ? "✅ Login Karein" : "🚀 Account Create Karein"}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================
              8. ADD FAMOUS SPOT / BUSINESS MODAL
          ========================================== */}
          {addModal && (
            <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl border border-orange-200 shadow-2xl w-full max-w-lg p-6 max-h-[92vh] overflow-auto relative">
                <button
                  onClick={() => setAddModal(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 grid place-items-center text-stone-600"
                >
                  ✕
                </button>

                <h2 className="font-display font-bold text-xl text-stone-900 mb-1">
                  ➕ Add Famous Spot ya Apni Dukan
                </h2>
                <p className="text-xs text-stone-500 mb-4">
                  Kisi bhi shehar ya gaon ki mashhoor jagah, mandir, food joint ya apna business jodein.
                </p>

                <form onSubmit={handleAddBusiness} className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-stone-700">Jagah ya Dukan ka Naam *</label>
                    <input
                      type="text"
                      required
                      value={bizForm.name}
                      onChange={(e) => setBizForm({ ...bizForm, name: e.target.value })}
                      placeholder="Jaise: Kashi Chaat Bhandar ya Sharma Electronics"
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 outline-none focus:border-orange-500 text-sm"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-stone-700">Category *</label>
                      <select
                        value={bizForm.category}
                        onChange={(e) => setBizForm({ ...bizForm, category: e.target.value })}
                        className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 bg-white text-sm"
                      >
                        {CATEGORIES.filter(c => c !== "All").map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-stone-700">Phone / Contact</label>
                      <input
                        type="text"
                        value={bizForm.phone}
                        onChange={(e) => setBizForm({ ...bizForm, phone: e.target.value })}
                        placeholder="+91 98765 43210"
                        className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-stone-700">City / Zila / Gaon Chunein *</label>
                    <div className="mt-1">
                      <LocationPicker
                        value={bizForm.cityLoc?.display || ""}
                        onSelect={(loc) => setBizForm({ ...bizForm, cityLoc: loc })}
                        placeholder="Shehar ya Gaon type karein..."
                        allowCustom={true}
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-stone-700">Kis Chiz Ke Liye Famous Hai? (Tagline)</label>
                    <input
                      type="text"
                      value={bizForm.famousTag}
                      onChange={(e) => setBizForm({ ...bizForm, famousTag: e.target.value })}
                      placeholder="Jaise: Best Samosa & Jalebi Since 1985"
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-stone-700">Pura Pata (Address) & Vivaran</label>
                    <input
                      type="text"
                      value={bizForm.address}
                      onChange={(e) => setBizForm({ ...bizForm, address: e.target.value })}
                      placeholder="Main Road, Station Chowk..."
                      className="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-orange-200 text-sm"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm shadow-md transition"
                  >
                    ✅ Publish on SahiRank Map
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-stone-900 text-white text-xs sm:text-sm font-semibold shadow-2xl border border-orange-400">
              {toast}
            </div>
          )}

          {/* FOOTER */}
          <footer className="max-w-[1360px] w-full mx-auto px-3 sm:px-6 py-6 text-xs text-stone-500 border-t border-orange-200/70 mt-8 flex flex-wrap justify-between gap-2">
            <div>✅ <b>SahiRank V17 Pro:</b> All 28 States + 8 UTs Covered ({ALL_LOCATIONS.length}+ Locations)</div>
            <div>✅ Instant Famous Landmarks, Markets, Food & Live Wikipedia/Map Explorer</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
